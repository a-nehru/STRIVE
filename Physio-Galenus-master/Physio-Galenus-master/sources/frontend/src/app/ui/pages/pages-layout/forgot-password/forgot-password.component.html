<div class="container">
  <mat-card class="card-container mat-elevation-z3">
    <mat-icon class="main-icon" color="primary"
      >lock</mat-icon
    >
    <mat-card-subtitle class="text-center"
      >Cannot log in? Reset your credentials</mat-card-subtitle
    >
    <mat-card-title class="mb-4 text-center">Physio Galenus</mat-card-title>
    <mat-card-content>
      <form [formGroup]="state.forgotPwdFg" (ngSubmit)="onSubmit()">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Enter your email</mat-label>
          <mat-hint>A recovery link will be sent to this email</mat-hint>
          <input matInput id="email" type="text" formControlName="email" />
          <mat-error
            *ngIf="state.forgotPwdFg.get('email')?.hasError('required')"
            >Email is required</mat-error
          >
          <mat-error *ngIf="state.forgotPwdFg.get('email')?.invalid">{{
            state.forgotPwdFg.get("email")?.hasError("email")
              ? "Invalid email address"
              : ""
          }}</mat-error>
        </mat-form-field>

        <mat-hint class="mat-error" *ngIf="state.errorMessage">{{
          state.errorMessage
        }}</mat-hint>
        <button
          mat-raised-button
          color="primary"
          class="button-hover w-100 mt-2 mb-2 text-center"
          type="submit"
        >
          Request password
        </button>
      </form>
    </mat-card-content>
    <mat-divider class="mt-3" [inset]="true"></mat-divider>
    <mat-card-actions class="mt-2 mb-1 d-flex justify-content-center">
      <span>Remember password?&nbsp;</span>
      <a class="btn-link" routerLink="/login">Back to log in</a>
    </mat-card-actions>
  </mat-card>
</div>
