<div class="container">
  <mat-card class="card-container mat-elevation-z3">
    <mat-icon class="main-icon" color="primary"
      >account_circle</mat-icon
    >
    <mat-card-subtitle class="text-center"
      >Log in to continue to</mat-card-subtitle
    >
    <mat-card-title class="mb-4 text-center">Physio Galenus</mat-card-title>
    <mat-card-content>
      <form [formGroup]="state.loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Enter your email</mat-label>
          <input matInput id="email" type="text" formControlName="username" />
          <mat-error
            *ngIf="state.loginForm.get('username')?.hasError('required')"
            >Email is required</mat-error
          >
          <mat-error *ngIf="state.loginForm.get('username')?.invalid">{{
            state.loginForm.get("username")?.hasError("email")
              ? "Invalid email address"
              : ""
          }}</mat-error>
        </mat-form-field>

        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Enter your password</mat-label>
          <input
            matInput
            id="password"
            [type]="state.hidePwd ? 'password' : 'text'"
            formControlName="password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="state.hidePwd = !state.hidePwd"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="state.hidePwd"
          >
            <mat-icon>{{
              state.hidePwd ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
          <mat-error
            *ngIf="state.loginForm.get('password')?.hasError('required')"
            >Password is required</mat-error
          >
        </mat-form-field>

        <mat-hint class="mat-error" *ngIf="state.errorMessage">{{
          state.errorMessage
        }}</mat-hint>
        <button
          mat-raised-button
          color="primary"
          class="button-hover w-100 mb-2 text-center"
          type="submit"
        >
          Log in
        </button>
      </form>
    </mat-card-content>
    <mat-divider class="mt-3" [inset]="true"></mat-divider>
    <mat-card-actions class="mt-2 mb-1 d-flex justify-content-between">
      <a class="ml-3 btn-link" routerLink="/forgot-password">Forgot password?</a>
      <a class="mr-3 btn-link" routerLink="/signup">Sign up</a>
    </mat-card-actions>
  </mat-card>
</div>
