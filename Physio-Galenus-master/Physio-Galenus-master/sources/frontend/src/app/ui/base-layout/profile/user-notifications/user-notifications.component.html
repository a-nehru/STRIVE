<app-loading [isLoading]="(isLoading$ | async) || false"></app-loading>
<app-page-heading
  [heading]="state.heading"
  [subheading]="state.subheading"
  [icon]="state.headingIcon"
></app-page-heading>
<div class="d-flex">
  <div class="mb-5 container">
    <mat-card class="row mat-elevation-z3">
      <app-table-notifications
        [canArchive]="true"
        [canRead]="true"
        [canRemove]="true"
        [canDelete]="false"
        [canRestore]="false"
        [notifications]="notifications$ | async"
        (removeEvent)="onRemove($event)"
        (readEvent)="onRead($event)"
        (archiveEvent)="onArchive($event)"
        (bulkUpdateEvent)="onBulkUpdate($event)"
      >
      </app-table-notifications>
      <app-pagination
        [paginationData]="paginationData"
        [paginationOptions]="paginationOptions"
        (pageChange)="onPageChange()"
      ></app-pagination>
    </mat-card>
  </div>
</div>
