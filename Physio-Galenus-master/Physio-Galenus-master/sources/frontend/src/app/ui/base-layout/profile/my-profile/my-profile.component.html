<app-loading [isLoading]="state.isLoading"></app-loading>
<app-page-heading
  [heading]="state.heading"
  [subheading]="state.subheading"
  [icon]="state.headingIcon"
></app-page-heading>
<div class="container">
  <form [formGroup]="state.userForm" (ngSubmit)="onSubmit()">
    <mat-card class="row">
      <mat-card-header>
        <mat-card-title>Profile information</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field class="d-block">
          <mat-label>Username</mat-label>
          <input
            matInput
            required
            [readonly]="!state.editing"
            type="text"
            formControlName="username"
          />
        </mat-form-field>

        <mat-form-field class="d-block" *ngIf="!isDemo">
          <mat-label>Pricing Plan</mat-label>
          <input
            *ngIf="!state.editing"
            matInput
            required
            type="text"
            formControlName="pricingPlanType"
          />
          <mat-select
            required
            *ngIf="state.editing"
            formControlName="pricingPlanType"
          >
            <mat-option
              *ngFor="
                let pricing of this.imports.Object.values(
                  this.imports.EPricingPlanType
                )
              "
              [value]="pricing"
              [disabled]="pricing === this.imports.EPricingPlanType.Personal"
            >
              {{ pricing }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field class="d-block">
          <mat-label>Access Token as Patient</mat-label>
          <input matInput type="text" formControlName="token" />
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <div class="mt-3 mb-3 row d-flex justify-content-end">
      <button
        mat-stroked-button
        type="button"
        *ngIf="state.editing"
        (click)="restoreFormData()"
        class="bg-white"
      >
        Cancel
      </button>
      <button
        mat-flat-button
        *ngIf="state.editing"
        color="primary"
        class="ml-2"
      >
        Save
      </button>
      <button
        mat-flat-button
        type="button"
        *ngIf="!state.editing && !isDemo"
        (click)="state.editing = true"
        color="primary"
        class="ml-2"
      >
        Edit
      </button>
    </div>
  </form>
</div>
