<app-page-heading
  [heading]="state.heading"
  [subheading]="state.subheading"
  [icon]="state.headingIcon"
></app-page-heading>
<div class="container">
  <form
    [formGroup]="state.registerPatientForm"
    (ngSubmit)="onSubmit()"
  >
    <mat-card class="row">
      <mat-form-field class="d-block">
        <mat-label>Nickname</mat-label>
        <input matInput required type="text" formControlName="nickname" />
      </mat-form-field>

      <mat-form-field class="d-block">
        <mat-label>Email</mat-label>
        <input matInput type="text" formControlName="username" />
      </mat-form-field>

      <mat-form-field class="d-block">
        <mat-label>Birthdate</mat-label>
        <input
          matInput
          required
          type="text"
          [matDatepicker]="birthdatePicker"
          formControlName="birthdate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="birthdatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker #birthdatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="d-block">
        <mat-label>Gender</mat-label>
        <mat-select required formControlName="gender">
          <mat-option
            *ngFor="
              let gender of this.imports.Object.values(this.imports.EGender)
            "
            [value]="gender"
          >
            {{ gender }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field
        class="d-block"
        *ngIf="
          this.state.registerPatientForm.get('gender')?.value ===
          this.imports.EGender.PreferToSelfDescribe
        "
      >
        <mat-label>Self-described gender</mat-label>
        <input matInput type="text" formControlName="preferSelfDescribe" />
      </mat-form-field>

      <mat-form-field class="d-block">
        <mat-label>Stroke Side</mat-label>
        <mat-select required formControlName="strokeSide">
          <mat-option
            *ngFor="
              let strokeSide of this.imports.Object.values(this.imports.EStrokeSide)
            "
            [value]="strokeSide"
          >
            {{ strokeSide }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="d-block">
        <mat-slider min="0" max="100" step="1" formControlName="mobility" required class="w-100"></mat-slider>
        <p class="text-center">Patient Mobility</p>
      </div>
    </mat-card>
    <div class="mt-3 mb-3 row d-flex justify-content-end">
      <button
        mat-flat-button
        color="primary"
        [appIfPermissionsEnable]="addPatientPermission"
      >
        Register
      </button>
    </div>
  </form>
</div>
